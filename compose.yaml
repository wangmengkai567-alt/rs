name: gowalla-course-a

x-mongo: &mongo
  image: mongo:7.0
  extra_hosts:
    gowalla-shard2: "${GOWALLA_B_IP:?Set GOWALLA_B_IP in .env}"

services:
  cfg:
    <<: *mongo
    restart: unless-stopped
    command: [mongod, --configsvr, --replSet, cfg, --port, "27019", --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    ports:
      - "${GOWALLA_A_IP:?Set GOWALLA_A_IP in .env}:27019:27019"
    networks:
      default:
        aliases: [gowalla-cfg]
    volumes:
      - config_data:/data/configdb

  shard1:
    <<: *mongo
    restart: unless-stopped
    command: [mongod, --shardsvr, --replSet, shard1, --port, "27011", --bind_ip_all, --wiredTigerCacheSizeGB, "0.5"]
    ports:
      - "${GOWALLA_A_IP:?Set GOWALLA_A_IP in .env}:27011:27011"
    networks:
      default:
        aliases: [gowalla-shard1]
    volumes:
      - shard1_data:/data/db
      - ./db:/scripts:ro

  replica-init:
    <<: *mongo
    depends_on: [cfg, shard1]
    environment:
      GOWALLA_A_IP: "${GOWALLA_A_IP:?Set GOWALLA_A_IP in .env}"
      GOWALLA_B_IP: "${GOWALLA_B_IP:?Set GOWALLA_B_IP in .env}"
    entrypoint: [mongosh, --nodb, --quiet, --file, /scripts/init_replicas.js]
    volumes:
      - ./db:/scripts:ro

  mongos:
    <<: *mongo
    restart: unless-stopped
    command: [mongos, --configdb, "cfg/gowalla-cfg:27019", --bind_ip_all]
    depends_on:
      replica-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./db:/scripts:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 3s
      timeout: 4s
      retries: 30

  sharding-init:
    <<: *mongo
    depends_on:
      mongos:
        condition: service_healthy
    entrypoint: [mongosh, "mongodb://mongos:27017/admin", --quiet, --file, /scripts/init_sharding.js]
    volumes:
      - ./db:/scripts:ro

volumes:
  config_data:
  shard1_data:
